# config/manifests/overlays/odh installed the way a platform operator installs
# it: into a namespace the platform owns, with every image set through the
# params.env the platform resolves (base/params.env). test_tls_kind.sh
# --overlay odh rewrites that file in a staged copy first.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mx-platform
resources:
- namespace.yaml
- ../../../config/manifests/overlays/odh
- ../kind_crds
patches:
- target:
    group: apps
    version: v1
    kind: Deployment
    name: modelexpress-operator
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: modelexpress-operator
    spec:
      template:
        spec:
          containers:
          - name: operator
            env:
            - name: RUST_LOG
              value: info,modelexpress_operator=debug,kube_runtime=debug
